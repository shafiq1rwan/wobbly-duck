<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8ED8FF" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Wobbly Duck</title>
    <!-- Start image downloads in parallel with the JS bundle (Phaser reuses them via <img> loading). -->
    <link rel="preload" as="image" href="./assets/duck-sheet.webp" type="image/webp" />
    <link rel="preload" as="image" href="./assets/bg-palms.webp" type="image/webp" />
    <link rel="preload" as="image" href="./assets/bg-rocks.webp" type="image/webp" />
    <link rel="preload" as="image" href="./assets/bg-clouds.webp" type="image/webp" />
    <!-- Critical loading-screen styles, inline so it paints before any CSS/JS arrives. -->
    <style>
      #loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: linear-gradient(#3ac3fd, #bdebfd);
        transition: opacity 0.25s ease-out;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      .loader-title {
        font: 700 clamp(44px, 10vmin, 84px) / 0.9 'Fredoka', 'Trebuchet MS', 'Arial Rounded MT Bold', sans-serif;
        text-align: center;
        text-transform: uppercase;
        color: #fff;
        transform: rotate(-3deg);
        text-shadow:
          0 -4px #13266a, 3px -3px #13266a, 4px 0 #13266a, 3px 3px #13266a, 0 4px #13266a, -3px 3px #13266a,
          -4px 0 #13266a, -3px -3px #13266a, 0 7px #13266a;
      }
      .loader-title span {
        color: #ffd93f;
      }
      .loader-bar {
        width: min(240px, 60vw);
        height: 18px;
        padding: 3px;
        border: 3px solid #13266a;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.6);
      }
      #loader-fill {
        width: 8%;
        height: 100%;
        border-radius: 999px;
        background: #ffd93f;
        transition: width 0.2s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
      <div class="loader-title">Wobbly<br /><span>Duck</span></div>
      <div class="loader-bar"><div id="loader-fill"></div></div>
    </div>

    <!-- Icons (Phosphor, MIT) are injected as an SVG sprite by src/ui/icons.ts; use <use href="#i-…">. -->
    <div id="game"></div>

    <div id="ui">
      <!-- Gameplay HUD -->
      <div id="hud" class="screen" hidden>
        <div class="hud-chips">
          <div class="chip"><span id="hud-distance">0</span>&nbsp;m</div>
          <!-- Star chip arrives with collectibles (Phase 3) -->
        </div>
        <button id="btn-pause" class="icon-btn icon-btn-square" aria-label="Pause">
          <svg class="icon"><use href="#i-pause" /></svg>
        </button>
      </div>

      <!-- Main menu -->
      <div id="menu" class="screen menu-screen" hidden>
        <button id="btn-sound-menu" class="icon-btn sound-btn" aria-label="Sound on" aria-pressed="true">
          <svg class="icon when-on"><use href="#i-sound-on" /></svg>
          <svg class="icon when-off"><use href="#i-sound-off" /></svg>
        </button>
        <div class="menu-stack">
          <h1 class="logo" aria-label="Wobbly Duck">
            <span class="logo-top">Wobbly</span>
            <span class="logo-bottom">Duck</span>
          </h1>
          <button id="btn-play" class="btn btn-primary btn-play" aria-label="Play">
            <svg class="icon"><use href="#i-play" /></svg>
          </button>
          <div class="best-badge">
            <svg class="crown"><use href="#i-crown" /></svg>
            <div class="best-text">
              <span class="best-label">Best Distance</span>
              <span class="best-value"><span id="menu-best">0</span> m</span>
            </div>
          </div>
        </div>
        <p id="menu-hint" class="hint">
          <span class="hint-desktop">Space / W / ↑ to jump &nbsp;·&nbsp; D / → to dash</span>
          <span class="hint-touch">Swipe up to jump &nbsp;·&nbsp; Swipe right to dash</span>
        </p>
      </div>

      <!-- Pause -->
      <div id="pause" class="screen panel-screen dim" hidden>
        <button id="btn-sound-pause" class="icon-btn sound-btn" aria-label="Sound on" aria-pressed="true">
          <svg class="icon when-on"><use href="#i-sound-on" /></svg>
          <svg class="icon when-off"><use href="#i-sound-off" /></svg>
        </button>
        <div class="modal">
          <h2 class="title">Paused</h2>
          <div class="btn-row">
            <button id="btn-home-pause" class="btn btn-secondary" aria-label="Main menu">
              <svg class="icon"><use href="#i-home" /></svg>
            </button>
            <button id="btn-resume" class="btn btn-primary btn-wide">
              <svg class="icon"><use href="#i-play" /></svg><span>Resume</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Game over -->
      <div id="gameover" class="screen panel-screen dim" hidden>
        <div class="modal">
          <h2 class="title">Game Over</h2>
          <div class="stats-card">
            <div class="stat-row">
              <span>Distance</span>
              <strong><span id="go-distance">0</span> m</strong>
            </div>
            <!-- Stars row arrives with collectibles (Phase 3) -->
          </div>
          <div id="go-best-badge" class="best-badge">
            <svg class="crown"><use href="#i-crown" /></svg>
            <div class="best-text">
              <span id="go-best-label" class="best-label">Best Distance</span>
              <span class="best-value"><span id="go-best">0</span> m</span>
            </div>
          </div>
          <div class="btn-row">
            <button id="btn-home" class="btn btn-secondary" aria-label="Main menu">
              <svg class="icon"><use href="#i-home" /></svg>
            </button>
            <button id="btn-restart" class="btn btn-primary btn-wide">
              <svg class="icon"><use href="#i-replay" /></svg><span>Play Again</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
